# Qdrant 向量数据库（可选）
# 默认无需 Docker：长期记忆使用 Qdrant 本地持久化模式（数据落盘 DATA_DIR/qdrant）。
# 仅当需要多进程共享或大规模场景时，才启动本服务并配置 QDRANT_URL。
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: research-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

